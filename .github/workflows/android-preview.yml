name: Android Preview Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Dev-Connect-Mobile/package-lock.json

      - name: Install dependencies
        working-directory: Dev-Connect-Mobile
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Build preview APK
        working-directory: Dev-Connect-Mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dev-connect-preview-apk
          path: Dev-Connect-Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
